[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finsent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas", "datasets","transformers","sqlalchemy", "psycopg[binary]", "python-dotenv","scikit-learn","mlflow","torch","peft","accelerate","fastapi","uvicorn"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "dvc","matplotlib","ipykernel","httpx"]

[tool.setuptools.packages.find]
where = ["src"]